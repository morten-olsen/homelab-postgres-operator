---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgres.homelab.mortenolsen.pro
  resources:
  - postgresclusters
  - postgresdatabases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgres.homelab.mortenolsen.pro
  resources:
  - postgresclusters/finalizers
  - postgresdatabases/finalizers
  verbs:
  - update
- apiGroups:
  - postgres.homelab.mortenolsen.pro
  resources:
  - postgresclusters/status
  - postgresdatabases/status
  verbs:
  - get
  - patch
  - update
