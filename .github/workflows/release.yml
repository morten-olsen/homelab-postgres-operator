name: Release

# Main and branch pushes validate only. Publication requires an approved Forgejo tag.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Serialize publications and never interrupt an image/chart publication halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'publication' || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-checks:
    name: Release Safety Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_release_check.py' -v

  version:
    name: Verify Forgejo Release
    runs-on: ubuntu-latest
    needs: [release-checks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Verify source tag and unused version
        id: tag_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          python3 scripts/release_check.py --operator postgres-operator
          --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          --github-output "$GITHUB_OUTPUT"

  # Build and push container image
  build-and-push:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: [release-checks, version]
    if: always() && needs.release-checks.result == 'success' && (needs.version.result == 'success' || github.event_name == 'pull_request')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=${{ needs.version.outputs.new_version }},enable=${{ needs.version.outputs.new_version != '' }}

      - name: Install Helm for publication recheck
        if: github.event_name != 'pull_request'
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Recheck immediately before image publication
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ needs.version.outputs.new_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          python3 scripts/release_check.py --operator postgres-operator
          --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --stage image

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-and-push]
    if: needs.version.result == 'success' && needs.version.outputs.new_tag != ''
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Generate install manifests
        run: |
          cd config/manager && kustomize edit set image controller=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_version }}
          cd ../..
          kustomize build config/default > install.yaml

      - name: Package Helm chart
        run: |
          sed -i "s/^version:.*/version: ${{ needs.version.outputs.new_version }}/" charts/postgres-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ needs.version.outputs.new_version }}\"/" charts/postgres-operator/Chart.yaml
          helm package charts/postgres-operator

      - name: Recheck immediately before release publication
        env:
          RELEASE_TAG: ${{ needs.version.outputs.new_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          python3 scripts/release_check.py --operator postgres-operator
          --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --stage release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: Release ${{ needs.version.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            install.yaml
            postgres-operator-*.tgz
