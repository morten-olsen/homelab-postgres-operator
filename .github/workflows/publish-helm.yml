name: Publish Helm Repository

# workflow_run uses the default-branch ref, preserving the main-only Pages environment.
# Its payload is untrusted until the read-only job verifies the tag delivered by the Forgejo push mirror.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: operator-helm-publication
  cancel-in-progress: false

jobs:
  version:
    name: Verify Completed Forgejo Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
      release_commit: ${{ steps.tag_version.outputs.release_commit }}
    steps:
      # Run the trusted default-branch verifier before checking out event-supplied code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Verify event, source tag and completed artifacts
        id: tag_version
        run: >-
          python3 scripts/release_check.py --operator postgres-operator
          --workflow-run "$GITHUB_EVENT_PATH" --stage pages
          --github-output "$GITHUB_OUTPUT"

  # Update Helm repository on GitHub Pages
  update-helm-repo:
    name: Update Helm Repository
    runs-on: ubuntu-latest
    needs: [version]
    if: needs.version.result == 'success' && needs.version.outputs.new_tag != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create Helm packages directory
        run: mkdir -p _site

      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${{ needs.version.outputs.new_version }}/" charts/postgres-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ needs.version.outputs.new_version }}\"/" charts/postgres-operator/Chart.yaml

      - name: Download existing Helm packages and index
        run: |
          # Preserve the existing chart history; a failed read must stop publication
          curl -fsSL https://morten-olsen.github.io/homelab-postgres-operator/index.yaml -o _site/index.yaml

          # Download all existing chart packages referenced in the index
          if [ -f _site/index.yaml ]; then
            # Extract all .tgz URLs from the index and download them
            grep -oP 'https://[^"]+\.tgz' _site/index.yaml | sort -u | while read url; do
              filename=$(basename "$url")
              echo "Downloading existing package: $filename"
              curl -fsSL "$url" -o "_site/$filename"
            done
          fi

      - name: Package Helm chart
        run: |
          helm package charts/postgres-operator -d _site

      - name: Generate Helm repo index
        run: |
          # Merge new package into existing index, or create new index if none exists
          if [ -f _site/index.yaml ]; then
            helm repo index _site --url https://morten-olsen.github.io/homelab-postgres-operator --merge _site/index.yaml
          else
            helm repo index _site --url https://morten-olsen.github.io/homelab-postgres-operator
          fi

      - name: Create index.html
        run: |
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Postgres Operator Helm Repository</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem;
                line-height: 1.6;
              }
              h1 { color: #333; }
              code {
                background: #f4f4f4;
                padding: 0.2rem 0.4rem;
                border-radius: 4px;
                font-size: 0.9em;
              }
              pre {
                background: #f4f4f4;
                padding: 1rem;
                border-radius: 8px;
                overflow-x: auto;
              }
              pre code {
                background: none;
                padding: 0;
              }
              a { color: #0066cc; }
            </style>
          </head>
          <body>
            <h1>🔬 Postgres Operator Helm Repository</h1>
            <p>
              This is the Helm chart repository for the 
              <a href="https://github.com/morten-olsen/homelab-postgres-operator">Postgres Operator</a>.
            </p>
            
            <h2>Usage</h2>
            <p>Add this repository to Helm:</p>
            <pre><code>helm repo add postgres-operator https://morten-olsen.github.io/homelab-postgres-operator
          helm repo update</code></pre>
            
            <p>Install the chart:</p>
            <pre><code>helm install postgres-operator postgres-operator/postgres-operator \
            --namespace postgres-operator-system \
            --create-namespace</code></pre>
            
            <h2>Links</h2>
            <ul>
              <li><a href="https://github.com/morten-olsen/homelab-postgres-operator">GitHub Repository</a></li>
              <li><a href="./index.yaml">Helm Repository Index</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Recheck immediately before pages publication
        env:
          RELEASE_TAG: ${{ needs.version.outputs.new_tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.release_commit }}
        run: >-
          python3 scripts/release_check.py --operator postgres-operator
          --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --stage pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
