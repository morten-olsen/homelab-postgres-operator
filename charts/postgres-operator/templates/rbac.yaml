apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postgres-operator.serviceAccountName" . }}
  labels:
    {{- include "postgres-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "postgres-operator.fullname" . }}
  labels:
    {{- include "postgres-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - postgres.homelab.mortenolsen.pro
    resources:
      - postgresclusters
      - postgresdatabases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - postgres.homelab.mortenolsen.pro
    resources:
      - postgresclusters/finalizers
      - postgresdatabases/finalizers
    verbs:
      - update
  - apiGroups:
      - postgres.homelab.mortenolsen.pro
    resources:
      - postgresclusters/status
      - postgresdatabases/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "postgres-operator.fullname" . }}
  labels:
    {{- include "postgres-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "postgres-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "postgres-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
